# Model parameters for "Planning Electric Vehicle Charging Infrastructure:
# A Data-Driven Framework for Saudi Arabia's Transition" (EPSR-D-26-08185).
# Every value below is the baseline used in the revised manuscript.
# Section / table references point to the revised manuscript.

demand:                         # Section 3.2.2, Equations (2)-(4)
  scenarios:                    # EV share of the light-duty fleet
    S1: 0.30                    # indicative horizon 2027
    S2: 0.50                    # indicative horizon 2030
    S3: 0.78                    # mid-term case
    S4: 1.00                    # indicative horizon 2037
  annual_vkt_km: 18000          # D_annual, Ministry of Transport statistics [23]
  specific_consumption_kwh_per_km: 0.20   # eta, IEA benchmark incl. A/C penalty [1, 27]
  public_charging_fraction: 0.35          # alpha_public, scenario value

chargers:                       # Section 3.2.3, Equations (5)-(7), Table 2
  AC:                           # AC Level 2
    rated_power_kw: 7.2
    utilization: 0.15           # U_c, dimensionless average power-utilisation (load) factor
    demand_share: 0.60          # sigma_c, share of public ENERGY served
    predominant_classes: [urban, peri-urban]
  DC:                           # DC fast 50 kW
    rated_power_kw: 50
    utilization: 0.12
    demand_share: 0.40
    predominant_classes: [highway, remote]
  availability_beta: 1.0        # beta; 0.92 examined in Section 4.3
  hours_per_year: 8760

allocation:                     # Section 3.2.4, Equations (8)-(9)
  w1_population_density: 0.40
  w2_road_proximity: 0.30
  w3_typology: 0.30
  normalization: national       # min-max normalisation of D_s and R_s ("national" or "regional")
  min_coverage_threshold: 0.5   # stations with a computed share < 0.5 receive one charger of the predominant type

cgi:                            # Section 3.2.5, Equation (10)
  underserved_below: 0.90
  oversupplied_from: 1.10
  threshold_sensitivity: [0.85, 0.90, 0.95]

sensitivity:                    # Section 3.2.6 / 4.6, Table 6
  reference_scenario: S2
  perturbation: 0.30

economics:                      # Sections 4.6 and 4.8, Table 8
  usd_per_sar: 0.2666667        # 1 USD = 3.75 SAR
  capex_equipment_usd: {AC: 2500, DC: 35000}
  capex_installed_usd: {AC: 8500, DC: 45000}
  rollout_years: 12             # 2025-2037
  peak_to_average_ratio: 1.5
  tariff_sar_per_kwh: 0.18      # reference electricity purchase tariff
  retail_price_sar_per_kwh: 1.80
  lcoc_non_energy_sar_per_kwh_at_UDC: 1.24   # non-energy LCOC component at U_DC = 0.12 (inversely proportional to U)
  opex_fraction_of_capex: 0.03
  npv_horizon_years: 15
  discount_rate: 0.10
  table8_scenario: S3
  table8_scale_revenue_by_cgi: true   # regional revenue scaled by the Table 5 CGI
  table8_cgi_decimals: 2              # CGI rounded as printed in Table 5
  dsm_peak_reduction: [0.20, 0.30]
  pv_s5:                        # Scenario S5, Section 4.8
    stations: 2440
    pv_kwp: 60
    ghi_kwh_m2_day: 6.0
    performance_ratio: 0.74
    bess_kwh: 100
    capex_usd: {pv: 42000, bess: 28000, dc_charger: 45000, civil: 12000}
    export_rate_sar_per_kwh: 0.12
    lifetime_years: 20
